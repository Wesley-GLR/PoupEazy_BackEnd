services:
  db:
    image: postgres:16-alpine
    container_name: poupeazy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poupeazy
      POSTGRES_PASSWORD: poupeazy
      POSTGRES_DB: poupeazy
    ports:
      - "5432:5432"
    volumes:
      - poupeazy_pgdata:/var/lib/postgresql/data
      # Aplica o schema automaticamente na PRIMEIRA criacao do container.
      # (so roda enquanto o volume estiver vazio)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poupeazy -d poupeazy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Opcional: subir a API junto com o banco (docker compose --profile api up).
  # Para desenvolvimento normal, rode a API com `npm run dev` no host.
  api:
    profiles: ["api"]
    build: .
    container_name: poupeazy_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PORT: 3001
      DATABASE_URL: postgres://poupeazy:poupeazy@db:5432/poupeazy
      JWT_SECRET: troque_este_segredo_por_um_valor_aleatorio_longo
      JWT_EXPIRES_IN: 7d
      NODE_ENV: development
      CORS_ORIGIN: "*"
      PLUGGY_CLIENT_ID: ${PLUGGY_CLIENT_ID:-}
      PLUGGY_CLIENT_SECRET: ${PLUGGY_CLIENT_SECRET:-}
    ports:
      - "3001:3001"

volumes:
  poupeazy_pgdata:
