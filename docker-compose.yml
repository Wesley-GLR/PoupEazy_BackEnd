services:
  db:
    image: postgres:16-alpine
    container_name: poupeazy_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: poupeazy
      POSTGRES_PASSWORD: poupeazy
      POSTGRES_DB: poupeazy
    ports:
      - "5432:5432"
    volumes:
      - poupeazy_pgdata:/var/lib/postgresql/data
      # Aplica o schema automaticamente na PRIMEIRA criacao do container.
      # (so roda enquanto o volume estiver vazio)
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U poupeazy -d poupeazy"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Interface WEB para inspecionar o banco pelo navegador (alternativa leve ao DBeaver).
  # Acesse http://localhost:8080  ->  Sistema: PostgreSQL | Servidor: db |
  # Usuario: poupeazy | Senha: poupeazy | Base: poupeazy
  adminer:
    image: adminer:4
    container_name: poupeazy_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"

  # API do PoupEazy. Sobe junto com o banco em `docker compose up`.
  # Le as variaveis do arquivo .env (JWT_SECRET, PLUGGY_*, etc.) e sobrescreve
  # apenas o que e especifico do ambiente Docker (host do banco = `db`).
  api:
    build: .
    container_name: poupeazy_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      # Dentro da rede do Docker o banco e acessado pelo hostname `db`, nao localhost.
      DATABASE_URL: postgres://poupeazy:poupeazy@db:5432/poupeazy
      PORT: 3001
    ports:
      - "3001:3001"

volumes:
  poupeazy_pgdata:
